# PSO优化器配置文件
# 用于 pso_moose_optimizer.py

# MOOSE可执行文件和输入文件（直接使用原始文件，无需模板）
executable: "ailuro-opt"
input_file: "particle_friction_plastic_voce.i"
work_dir: "pso_optimization_work"
timeout: 180  # 单次模拟超时时间（秒）

# 输出文件配置
output_csv: "forward_out.csv"  # MOOSE输出的CSV文件名
objective_column: "objective_value"  # 目标函数所在列名

# 需要复制到工作目录的辅助文件（网格、数据等）
auxiliary_files:
  - "316L_2d_particle_contact_structural_ref_1.msh"
  - "ObjectiveCSV/extracted_disp_force.csv"

# 优化参数配置
parameters:
  names: ["p0", "p1", "p2"]  # 参数名称（对应输入文件中的变量）
  paths:  # MOOSE中的参数路径（用于命令行覆盖，使用顶层变量）
    - "p0"  # yield_stress
    - "p1"  # hardening_constant  
    - "p2"  # q
  descriptions: ["屈服应力 (yield_stress)", "硬化常数R (hardening_constant)", "硬化参数Q (q)"]
  lower_bounds: [10, 0, 0]      # 参数下界
  upper_bounds: [1200, 2000, 800]  # 参数上界

# PSO算法配置
pso:
  n_particles: 20           # 粒子数量
  max_iterations: 50        # 最大迭代次数
  inertia_weight: 0.9       # 惯性权重 w (0.4-0.9, 越大全局搜索能力越强)
  cognitive_param: 2.0      # 认知参数 c1 (通常1.5-2.0)
  social_param: 2.0         # 社会参数 c2 (通常1.5-2.0)

# 说明:
# - n_particles: 建议 10-30, 参数越多需要越多粒子
# - max_iterations: 建议 30-100, 取决于问题复杂度
# - inertia_weight: 0.9 适合前期探索, 0.4 适合后期收敛
#   可以使用动态调整: w = 0.9 - (0.9-0.4) * iter/max_iter
# - cognitive_param + social_param ≈ 4.0 是常用配置
#
# 总评估次数 ≈ n_particles × (max_iterations + 1)
# 对于本例: 20 × 51 = 1020 次评估
# 假设每次30秒: 总时间 ≈ 8.5 小时
#
# 建议先用小规模测试:
#   n_particles: 5
#   max_iterations: 10
#   总评估: 55次, 约30分钟
